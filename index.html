<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Bodega</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    
    <script>
        const APP_CONFIG = {
            GITHUB_USERNAME: 'elhabla19-art',
            TITLE: 'Github Bodega',
            SUBTITLE: 'Mis proyectos en GitHub Pages'
        };
    </script>
</head>
<body>
    <div class="warehouse">
        <header>
            <h1>Github Bodega</h1>
            <p class="subtitle">Mis proyectos alojados en GitHub Pages</p>
        </header>

        <div class="stats">
            <span id="projectCount">Cargando proyectos...</span>
        </div>

        <div id="projectsContainer" class="shelves">
            <!-- Los proyectos se mostrarán aquí -->
        </div>

        <footer>
            <p>GithubBodega - Proyectos publicos de elhabla19-art</p>
            <button id="qrButton" class="qr-button">QR</button>
        </footer>
    </div>

    <!-- Modal para el QR -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <img src="qr-code.png" alt="Código QR" class="qr-image">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
