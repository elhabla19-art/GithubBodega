<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Bodega</title>
    
    <!-- ============ FAVICONS PARA TODOS LOS NAVEGADORES ============ -->
    <!-- Favicon estándar para navegadores modernos -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- OBLIGATORIO para Safari en MacOS e iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Para navegadores que usan manifest (Chrome, Android) -->
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Meta tag para que Safari no intente hacer auto-detección -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- ============================================================ -->
    
    <link rel="stylesheet" href="style.css">
    <script>
        const APP_CONFIG = {
            GITHUB_USERNAME: 'elhabla19-art',
            TITLE: 'Github Bodega',
            SUBTITLE: 'Mis proyectos en GitHub Pages',
            DEFAULT_ROOM_CODE: 'GRIL',
            PROJECTS: {
                'QuixxDados': 'https://elhabla19-art.github.io/QuixxDados/',
                'FigurasDados': 'https://elhabla19-art.github.io/FigurasDados/',
                'CleverDados': 'https://elhabla19-art.github.io/CleverDados/',
                'MasterCartas': 'https://elhabla19-art.github.io/MasterCartas/',
                'ParaDice': 'https://elhabla19-art.github.io/ParaDice/',
                'JuegoCassettes': 'https://elhabla19-art.github.io/JuegoCassettes/'
            }
        };
    </script>
</head>
<body>
    <div class="warehouse">
        <header id="filterHeader" style="cursor: pointer;">
            <h1>Github Bodega</h1>
            <div id="syncIndicator" class="sync-indicator"></div>
        </header>

        <div id="filterDropdown" class="filter-dropdown">
            <div class="filter-dropdown-content">
                <div class="sync-config">
                    <label class="sync-toggle">
                        <input type="checkbox" id="syncToggle">
                        <span class="sync-label">
                            <span class="main">Sala Automática</span>
                        </span>
                    </label>
                </div>
                <hr class="sync-divider">
                <div id="filterTopicsContainer" class="filter-topics-container"></div>
            </div>
        </div>

        <div id="projectsContainer" class="shelves"></div>

        <footer>
            <p>GithubBodega - Proyectos publicos de elhabla19-art</p>
            <button id="qrButton" class="qr-button">QR</button>
        </footer>
    </div>

    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <img src="qr-code.png" alt="Codigo QR" class="qr-image">
        </div>
    </div>

    <script src="animations.js"></script>
    <script src="script.js"></script>
</body>
</html>
